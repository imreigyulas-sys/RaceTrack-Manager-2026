name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Godot Export APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Godot Export
        uses: firebelley/godot-export@v5.2.0
        with:
          godot-version: 4.3
          export-preset: Android
          package-name: palya-menedzser

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: /home/runner/work/root/root/build/android/game.apk # vagy amit generál
