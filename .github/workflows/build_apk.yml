name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Android APK (Verbose & Debug)
        run: |
          set -e
          echo "=== 1. Rendszerfüggőségek és Java ==="
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk

          echo "=== 2. Android SDK telepítése ==="
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          echo "=== 3. SDK licenszek elfogadása ==="
          yes | sdkmanager --licenses || true
          sdkmanager --update
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "=== 4. Godot Android SDK kapcsolat konfigurálása ==="
          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "=== 5. Godot 4.3 és export sablonok letöltése ==="
          GODOT_VERSION="4.3-stable"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d ~/.local/share/godot/export_templates/
          mv ~/.local/share/godot/export_templates/templates* ~/.local/share/godot/export_templates/4.3.stable

          echo "=== 6. Projektfájlok és Preset ellenőrzése ==="
          ls -la
          if [ -f "export_presets.cfg" ]; then
            echo "export_presets.cfg sikeresen megtalálva a projektben."
          else
            echo "HIBA: Az export_presets.cfg hiányzik! Biztosan beletetted a Godot export beállításokat a Git repository-ba?"
          fi

          echo "=== 7. APK exportálás részletes naplózással ==="
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/game.apk
          echo "Sikeres exportálás!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/android/game.apk
